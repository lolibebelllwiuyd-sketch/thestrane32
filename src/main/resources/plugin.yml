name: ZeinAC
main: me.zein.zeinac.ZeinAC
version: ${project.version}
api-version: "1.21"
description: Evidence-driven anti-xray and anti-freecam for Zein SMP
authors: [ZeinSMP]
softdepend: [packetevents]

commands:
  zeinac:
    description: ZeinAC anti-xray / anti-freecam
    usage: /zeinac <status|alerts|inspect|evidence|reload|exempt|unexempt|escalate>
    aliases: [zac]

permissions:
  zeinac.admin:
    description: Everything (status, reload, escalate) plus all staff permissions below
    default: op
    children:
      zeinac.alerts: true
      zeinac.inspect: true
      zeinac.exempt: true
  zeinac.alerts:
    description: Receive staff alerts and use /zeinac alerts
    default: op
  zeinac.inspect:
    description: Use /zeinac inspect and /zeinac evidence
    default: op
  zeinac.exempt:
    description: Use /zeinac exempt and /zeinac unexempt
    default: op
  zeinac.bypass:
    description: Never analysed by any ZeinAC check (use for testing accounts, not for regular staff)
    default: false
