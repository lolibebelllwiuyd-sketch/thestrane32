name: Build ZeinAC

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # only used by the release step on tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Compiles, runs the unit tests and packages the plugin.
      - name: Build with Maven
        run: mvn -B -ntp clean package

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: ZeinAC-jar
          path: target/ZeinAC-*.jar
          if-no-files-found: error

      # Pushing a tag like v1.0.0 also publishes the JAR as a GitHub Release.
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/ZeinAC-*.jar
          generate_release_notes: true
